name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Copy project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist,server.js,package.json,package-lock.json,src,tsconfig.json,vite.config.ts,index.html,metadata.json,README.md,.gitignore,.env"
          target: "/home/portfolio-vite"
          overwrite: true
          strip_components: 0

      - name: Restart app on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            export NVM_DIR="/root/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /home/portfolio-vite
            if [ ! -d node_modules ]; then
              npm ci
            fi

            lsof -ti:3002 | xargs kill -9 2>/dev/null || true
            lsof -ti:3004 | xargs kill -9 2>/dev/null || true

            sleep 1

            nohup node server.js > portfolio-app.log 2>&1 &

            sleep 3
            echo "Frontend PID: $(lsof -ti:3002)"
            echo "Backend PID: $(lsof -ti:3004)"
